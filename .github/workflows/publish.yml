name: Publicar site

on:
  schedule:
    # 06:00 em Brasília (UTC-3) = 09:00 UTC. O cron do GitHub é sempre em UTC.
    - cron: "0 9 * * *"
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o token dos cofres
        id: guard
        env:
          TOKEN: ${{ secrets.VAULTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Segredo VAULTS_TOKEN não configurado: nada foi publicado. Veja o README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Baixar os cofres (repositórios privados)
        if: steps.guard.outputs.ready == 'true'
        env:
          VAULTS_TOKEN: ${{ secrets.VAULTS_TOKEN }}
        run: python tools/fetch_vaults.py

      - name: Instalar dependências
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Gerar o site
        if: steps.guard.outputs.ready == 'true'
        run: python build.py --out _site

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
