<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" font-family="'Segoe UI','Yu Gothic','Noto Sans',Arial,sans-serif"><rect width="860" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="430" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="middle">Texto vira tokens (divisão ilustrativa)</text><rect x="40" y="70" width="102" height="60" rx="6" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="91.0" y="108" font-size="24" fill="#0f172a" font-weight="normal" text-anchor="middle">Inte</text><rect x="148" y="70" width="122" height="60" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="209.0" y="108" font-size="24" fill="#0f172a" font-weight="normal" text-anchor="middle">ligên</text><rect x="276" y="70" width="82" height="60" rx="6" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="317.0" y="108" font-size="24" fill="#0f172a" font-weight="normal" text-anchor="middle">cia</text><rect x="364" y="70" width="122" height="60" rx="6" fill="#fbcfe8" stroke="#334155" stroke-width="2"/><text x="425.0" y="108" font-size="24" fill="#0f172a" font-weight="normal" text-anchor="middle"> arti</text><rect x="492" y="70" width="142" height="60" rx="6" fill="#ddd6fe" stroke="#334155" stroke-width="2"/><text x="563.0" y="108" font-size="24" fill="#0f172a" font-weight="normal" text-anchor="middle">ficial</text><text x="430" y="175" font-size="15" fill="#0f172a" font-weight="normal" text-anchor="middle">5 tokens neste exemplo, mas cada tokenizador divide de um jeito.</text><text x="430" y="202" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">Idiomas diferentes do inglês costumam render mais tokens para o mesmo texto.</text></svg>