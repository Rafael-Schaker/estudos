<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Segoe UI','Yu Gothic','Noto Sans',Arial,sans-serif"><rect width="960" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="34" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="middle">Tool × MCP × Skill × Plugin: quem é quem</text><rect x="20" y="56" width="220" height="250" rx="10" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="130" y="96" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="middle">Tool</text><text x="130" y="135" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">uma função que o modelo</text><text x="130" y="152" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">pode chamar</text><text x="130" y="197" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">quem aciona: o modelo</text><text x="130" y="259" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">ex.: buscar_pedido(id)</text><rect x="255" y="56" width="220" height="250" rx="10" fill="#ddd6fe" stroke="#334155" stroke-width="2"/><text x="365" y="96" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="middle">MCP</text><text x="365" y="135" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">protocolo padrão para</text><text x="365" y="152" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">expor tools, resources e</text><text x="365" y="169" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">prompts</text><text x="365" y="197" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">quem aciona: o</text><text x="365" y="214" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">cliente/modelo</text><text x="365" y="259" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">ex.: servidor MCP de</text><text x="365" y="276" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">arquivos</text><rect x="490" y="56" width="220" height="250" rx="10" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="600" y="96" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="middle">Skill</text><text x="600" y="135" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">pasta de instruções</text><text x="600" y="152" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">(SKILL.md) carregada</text><text x="600" y="169" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">quando útil</text><text x="600" y="197" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">quem aciona: o modelo,</text><text x="600" y="214" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">pela descrição</text><text x="600" y="259" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">ex.: revisar-relatorio</text><rect x="725" y="56" width="220" height="250" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="835" y="96" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="middle">Plugin</text><text x="835" y="135" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">pacote que reúne skills,</text><text x="835" y="152" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">comandos, hooks e</text><text x="835" y="169" font-size="13" fill="#0f172a" font-weight="normal" text-anchor="middle">servidores</text><text x="835" y="197" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">quem aciona: você instala</text><text x="835" y="214" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">e compartilha</text><text x="835" y="259" font-size="13" fill="#334155" font-weight="normal" text-anchor="middle">ex.: pacote da equipe</text></svg>