<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans CJK JP','MS Gothic',sans-serif"><rect width="900" height="330" rx="14" fill="#fffaf0" stroke="#d6c9a8" stroke-width="2"/><text x="450" y="34" font-size="20" fill="#1f2937" font-weight="bold" text-anchor="middle">A ordem das ideias: português × japonês</text><text x="30" y="90" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start">Português</text><rect x="150" y="62" width="90" height="50" rx="10" fill="#bfdbfe" stroke="#374151" stroke-width="2"/><text x="195.0" y="94" font-size="20" fill="#1f2937" font-weight="normal" text-anchor="middle">Eu</text><rect x="250" y="62" width="90" height="50" rx="10" fill="#fecaca" stroke="#374151" stroke-width="2"/><text x="295.0" y="94" font-size="20" fill="#1f2937" font-weight="normal" text-anchor="middle">li</text><rect x="350" y="62" width="150" height="50" rx="10" fill="#bbf7d0" stroke="#374151" stroke-width="2"/><text x="425.0" y="94" font-size="20" fill="#1f2937" font-weight="normal" text-anchor="middle">um livro</text><rect x="510" y="62" width="110" height="50" rx="10" fill="#fde68a" stroke="#374151" stroke-width="2"/><text x="565.0" y="94" font-size="20" fill="#1f2937" font-weight="normal" text-anchor="middle">ontem</text><text x="30" y="200" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start">Japonês</text><rect x="150" y="168" width="120" height="56" rx="10" fill="#bfdbfe" stroke="#374151" stroke-width="2"/><text x="210.0" y="204" font-size="24" fill="#1f2937" font-weight="normal" text-anchor="middle">私は</text><text x="210.0" y="246" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">tema</text><rect x="280" y="168" width="120" height="56" rx="10" fill="#fde68a" stroke="#374151" stroke-width="2"/><text x="340.0" y="204" font-size="24" fill="#1f2937" font-weight="normal" text-anchor="middle">昨日</text><text x="340.0" y="246" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">tempo</text><rect x="410" y="168" width="120" height="56" rx="10" fill="#bbf7d0" stroke="#374151" stroke-width="2"/><text x="470.0" y="204" font-size="24" fill="#1f2937" font-weight="normal" text-anchor="middle">本を</text><text x="470.0" y="246" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">objeto</text><rect x="540" y="168" width="170" height="56" rx="10" fill="#fecaca" stroke="#374151" stroke-width="2"/><text x="625.0" y="204" font-size="24" fill="#1f2937" font-weight="normal" text-anchor="middle">読みました</text><text x="625.0" y="246" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">verbo (por último)</text><text x="450" y="300" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="middle">O verbo vai no fim. Cada bloco leva uma partícula (は, を, で...) que diz o seu papel.</text></svg>